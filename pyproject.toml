[project]
name = "hasdata-google-flights-mcp"
version = "1.0.0"
description = "MCP server for Google Flights through HasData's hosted API. No Google account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "google-flights", "flights", "travel", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/google-flights-api"
Repository = "https://github.com/HasData/google-flights-mcp"

[project.scripts]
hasdata-google-flights-mcp = "hasdata_google_flights_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_google_flights_mcp"]
